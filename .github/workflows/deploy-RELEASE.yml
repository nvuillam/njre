---
#
# Documentation:
# https://help.github.com/en/articles/workflow-syntax-for-github-actions
#

#######################################
# Start the job on all push to master #
#######################################
name: "Build & Deploy - RELEASE"
on:
  release:
    # Want to run the automation when a release is created
    types: ["created"]

permissions: read-all

###############
# Set the Job #
###############
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: read
    environment:
      name: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Setup .npmrc file to publish to npm
      # release publish; no untrusted build cache
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0  # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          # Defaults to the user or organization that owns the workflow file
          scope: "nvuillam"
      # No install step: the package has no build/prepack scripts, npm publish
      # only packs package.json + lib/*.js. It also avoids `yarn` failing on
      # the ${NODE_AUTH_TOKEN} placeholder setup-node writes to .npmrc, which
      # is never set here (publish auth uses npm Trusted Publishers / OIDC).
      - run: npm publish
